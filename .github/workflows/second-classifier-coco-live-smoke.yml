name: Second Classifier COCO Live Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/second-classifier-coco-live-smoke.yml'
      - 'mf_lab/training/coco_paths.py'
      - 'mf_lab/training/stable_real_acquisition.py'
      - 'scripts/second_classifier_coco_live_smoke.py'
      - 'tests/test_second_classifier_coco_paths.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coco-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: >-
          python -m pip install --upgrade pip
          'numpy>=1.24'
          'Pillow>=10'
          'opencv-python-headless>=4.8,<5'
          'pytest>=8'

      - name: Unit-test canonical COCO ids
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_second_classifier_coco_paths.py

      - name: Download ten official COCO controls
        env:
          PYTHONPATH: .
        run: python scripts/second_classifier_coco_live_smoke.py

      - name: Upload live smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-classifier-coco-live-smoke
          path: work/second_classifier/coco-live-smoke/report.json
          if-no-files-found: warn
          retention-days: 14
