[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-forensics-lab"
version = "0.9.2"
description = "Reproducible media-forensics laboratory with classical, synthetic-media, AutoGAN-compatible spectral, visual-artifact and scientifically scoped machine-classification workflows."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "scikit-learn>=1.7.2,<1.8",
  "matplotlib>=3.7",
  "PyYAML>=6",
  "python-docx>=1.1",
  "Jinja2>=3.1",
  "Flask>=3.0",
  "c2pa-python>=0.37.10,<0.38"
]

[project.optional-dependencies]
test = ["pytest>=8"]
ai = ["datasets>=3", "huggingface_hub>=0.25"]
deep = ["onnxruntime>=1.17"]
autogan = ["torch>=2.2", "torchvision>=0.17"]

[project.scripts]
mflab = "mf_lab.cli:main"

[tool.setuptools.packages.find]
include = ["mf_lab*"]
exclude = ["dataset*", "templates*", "third_party*", "bibliography*", "tests*", "case-*", "benchmark*"]

[tool.setuptools.package-data]
mf_lab = [
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "models/*.joblib",
  "models/*.json"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
